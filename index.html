<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>บันทึกการจอดรถ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef4fb; --card: #ffffff; --ink: #1e3a5f; --muted: #6b7f99;
    --line: #d9e3ef; --accent: #2f6fdb; --teal: #14a3a3; --danger: #d64545;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Sarabun", system-ui, sans-serif; font-size: 16px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header.app {
    position: sticky; top: 0; z-index: 5; background: var(--ink); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header.app h1 { font-size: 18px; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(30,58,95,.08); }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .grid > div, .row > div { min-width: 0; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: #f8fbff;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 16px; /* ป้องกัน iOS ซูมอัตโนมัติ */
    min-width: 0; max-width: 100%;
  }
  input[type=date], input[type=datetime-local] { -webkit-appearance: none; appearance: none; min-height: 44px; }
  textarea { min-height: 70px; resize: vertical; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    padding: 12px 16px; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.secondary { background: #e3ecf8; color: var(--ink); }
  button.teal { background: var(--teal); }
  button.danger { background: transparent; color: var(--danger); padding: 6px 8px; }
  button.small { padding: 6px 10px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; }
  .photo-preview { margin-top: 8px; max-width: 100%; max-height: 180px; border-radius: 10px; display: none; }
  .list-item { border-top: 1px solid var(--line); padding: 12px 0; display: flex; gap: 12px; }
  .list-item:first-child { border-top: 0; }
  .list-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; }
  .list-item .info { flex: 1; min-width: 0; }
  .plate { font-weight: 700; font-size: 17px; }
  .meta { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e3ecf8; margin-left: 4px; }
  .badge.out { background: #dff5f1; color: #0d7a6f; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  #report { display: none; }

  /* ---------- โหมดพิมพ์ / บันทึกเป็น PDF ---------- */
  @page { size: A4; margin: 12mm; }
  @media print {
    body { background: #fff; font-size: 12px; }
    header.app, main, .toast { display: none !important; }
    #report { display: block; color: #000; }
    .r-head { text-align: center; margin-bottom: 8px; }
    .r-head h1 { font-size: 18px; margin: 0; }
    .r-head p { margin: 2px 0; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; word-wrap: break-word; }
    th:nth-child(1) { width: 5%; } th:nth-child(10) { width: 12%; }
    th, td { border: 1px solid #555; padding: 4px 5px; vertical-align: top; text-align: left; }
    th { background: #e6e6e6; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr { page-break-inside: avoid; }
    td img { width: 100%; max-width: 70px; height: auto; }
    .sign { display: flex; justify-content: space-around; margin-top: 36px; page-break-inside: avoid; }
    .sign div { text-align: center; }
  }
</style>
</head>
<body>
<header class="app">
  <h1>🚗 บันทึกการจอดรถ</h1>
  <button class="teal small" onclick="openReport()">🖨️ PDF</button>
</header>

<main>
  <section class="card">
    <h2 id="formTitle">บันทึกรายการใหม่</h2>
    <form id="form" autocomplete="off">
      <input type="hidden" id="id">
      <div class="grid">
        <div><label for="plate">ทะเบียนรถ *</label><input id="plate" required placeholder="เช่น 1กข 1234"></div>
        <div><label for="province">จังหวัด</label><input id="province" list="provinces" placeholder="นนทบุรี"></div>
        <div><label for="vehicle">ยี่ห้อ / สี</label><input id="vehicle" placeholder="Toyota ขาว"></div>
        <div><label for="type">ประเภท</label>
          <select id="type">
            <option>ลูกค้า</option><option>พนักงาน</option><option>ผู้มาติดต่อ</option>
            <option>รถส่งสินค้า</option><option>อื่น ๆ</option>
          </select>
        </div>
        <div><label for="zone">โซน / ช่องจอด</label><input id="zone" placeholder="A-12"></div>
        <div><label for="recorder">ผู้บันทึก</label><input id="recorder" placeholder="ชื่อผู้บันทึก"></div>
        <div><label for="timeIn">เวลาเข้า *</label><input id="timeIn" type="datetime-local" required></div>
        <div><label for="timeOut">เวลาออก</label><input id="timeOut" type="datetime-local"></div>
        <div class="full"><label for="note">หมายเหตุ</label><textarea id="note" placeholder="รายละเอียดเพิ่มเติม"></textarea></div>
        <div class="full">
          <label for="photo">รูปถ่าย (ถ้ามี)</label>
          <input id="photo" type="file" accept="image/*" capture="environment">
          <img id="photoPreview" class="photo-preview" alt="">
        </div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="resetForm()">ล้าง</button>
        <button type="submit">💾 บันทึก</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>รายการที่บันทึก</h2>
    <div class="row" style="margin-bottom:8px">
      <div><label for="fromDate">ตั้งแต่วันที่</label><input id="fromDate" type="date"></div>
      <div><label for="toDate">ถึงวันที่</label><input id="toDate" type="date"></div>
    </div>
    <input id="search" placeholder="🔍 ค้นหาทะเบียน / โซน / หมายเหตุ" style="margin-bottom:8px">
    <div class="actions" style="margin-top:0">
      <button class="teal" onclick="openReport()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<!-- เอกสารที่ใช้พิมพ์ (แสดงเฉพาะตอนพิมพ์) -->
<div id="report"></div>
<div id="toast" class="toast"></div>

<datalist id="provinces">
  <option>กรุงเทพมหานคร</option><option>นนทบุรี</option><option>ปทุมธานี</option>
  <option>สมุทรปราการ</option><option>นครปฐม</option><option>พระนครศรีอยุธยา</option>
</datalist>

<script>
const KEY = 'parking-records-v1';
const $ = (id) => document.getElementById(id);
let records = load();
let photoData = '';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(records)); return true; }
  catch (e) { toast('พื้นที่เก็บข้อมูลเต็ม — ลองลบรายการเก่าหรือไม่แนบรูป'); return false; }
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function nowLocal() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function fmt(v) {
  if (!v) return '-';
  return new Date(v).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
}
function fmtDate(v) {
  return new Date(v).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ย่อรูปก่อนเก็บ เพื่อไม่ให้ localStorage เต็ม
$('photo').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = () => { img.src = reader.result; };
  img.onload = () => {
    const max = 640, scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    photoData = c.toDataURL('image/jpeg', 0.6);
    $('photoPreview').src = photoData; $('photoPreview').style.display = 'block';
  };
  reader.readAsDataURL(file);
});

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const id = $('id').value || String(Date.now());
  const rec = {
    id,
    plate: $('plate').value.trim(), province: $('province').value.trim(),
    vehicle: $('vehicle').value.trim(), type: $('type').value,
    zone: $('zone').value.trim(), recorder: $('recorder').value.trim(),
    timeIn: $('timeIn').value, timeOut: $('timeOut').value,
    note: $('note').value.trim(), photo: photoData,
  };
  const i = records.findIndex(r => r.id === id);
  const backup = records.slice();
  if (i >= 0) records[i] = rec; else records.unshift(rec);
  if (!save()) { records = backup; return; }
  try { localStorage.setItem('parking-recorder', rec.recorder); } catch (e) {}
  toast(i >= 0 ? 'แก้ไขเรียบร้อย' : 'บันทึกเรียบร้อย');
  resetForm(); render();
});

function resetForm() {
  $('form').reset(); $('id').value = ''; photoData = '';
  $('photoPreview').style.display = 'none';
  $('timeIn').value = nowLocal();
  try { $('recorder').value = localStorage.getItem('parking-recorder') || ''; } catch (e) {}
  $('formTitle').textContent = 'บันทึกรายการใหม่';
}

function edit(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  for (const k of ['id', 'plate', 'province', 'vehicle', 'type', 'zone', 'recorder', 'timeIn', 'timeOut', 'note']) $(k).value = r[k] || '';
  photoData = r.photo || '';
  $('photoPreview').src = photoData; $('photoPreview').style.display = photoData ? 'block' : 'none';
  $('formTitle').textContent = 'แก้ไขรายการ';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function checkout(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  r.timeOut = nowLocal(); save(); render(); toast('บันทึกเวลาออกแล้ว');
}
function removeRec(id) {
  if (!confirm('ลบรายการนี้?')) return;
  records = records.filter(x => x.id !== id); save(); render();
}

function filtered() {
  const from = $('fromDate').value, to = $('toDate').value;
  const q = $('search').value.trim().toLowerCase();
  return records.filter(r => {
    const d = (r.timeIn || '').slice(0, 10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    if (q && ![r.plate, r.province, r.zone, r.note, r.vehicle, r.type].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const list = filtered();
  $('list').innerHTML = list.length ? list.map(r => `
    <div class="list-item">
      ${r.photo ? `<img src="${r.photo}" alt="">` : ''}
      <div class="info">
        <div class="plate">${esc(r.plate)} <span class="meta">${esc(r.province)}</span>
          <span class="badge ${r.timeOut ? 'out' : ''}">${r.timeOut ? 'ออกแล้ว' : 'จอดอยู่'}</span></div>
        <div class="meta">${esc(r.type)}${r.zone ? ' · โซน ' + esc(r.zone) : ''}${r.vehicle ? ' · ' + esc(r.vehicle) : ''}</div>
        <div class="meta">เข้า ${fmt(r.timeIn)} · ออก ${fmt(r.timeOut)}</div>
        ${r.note ? `<div class="meta">📝 ${esc(r.note)}</div>` : ''}
        <div class="row" style="margin-top:6px;gap:4px">
          ${r.timeOut ? '' : `<button class="small teal" style="flex:none" onclick="checkout('${r.id}')">บันทึกออก</button>`}
          <button class="small secondary" style="flex:none" onclick="edit('${r.id}')">แก้ไข</button>
          <button class="small secondary" style="flex:none" onclick="printOne('${r.id}')">PDF</button>
          <button class="danger small" style="flex:none" onclick="removeRec('${r.id}')">ลบ</button>
        </div>
      </div>
    </div>`).join('') : '<div class="empty">ยังไม่มีรายการ</div>';
}

function buildReport(list) {
  const from = $('fromDate').value, to = $('toDate').value;
  const range = from || to ? `ช่วงวันที่ ${from ? fmtDate(from) : '...'} ถึง ${to ? fmtDate(to) : '...'}` : 'ทุกรายการ';
  const rows = list.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><b>${esc(r.plate)}</b><br>${esc(r.province)}</td>
      <td>${esc(r.vehicle)}</td>
      <td>${esc(r.type)}</td>
      <td>${esc(r.zone)}</td>
      <td>${fmt(r.timeIn)}</td>
      <td>${fmt(r.timeOut)}</td>
      <td>${esc(r.note)}</td>
      <td>${esc(r.recorder)}</td>
      <td>${r.photo ? `<img src="${r.photo}" alt="">` : ''}</td>
    </tr>`).join('');
  $('report').innerHTML = `
    <div class="r-head">
      <h1>รายงานบันทึกการจอดรถ</h1>
      <p>${range} · จำนวน ${list.length} รายการ</p>
      <p style="font-size:11px">พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</p>
    </div>
    <table>
      <thead><tr><th>#</th><th>ทะเบียน</th><th>ยี่ห้อ/สี</th><th>ประเภท</th><th>โซน</th>
        <th>เวลาเข้า</th><th>เวลาออก</th><th>หมายเหตุ</th><th>ผู้บันทึก</th><th>รูป</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="10" style="text-align:center">ไม่มีรายการ</td></tr>'}</tbody>
    </table>
    <div class="sign">
      <div>ลงชื่อ ....................................<br>ผู้บันทึก</div>
      <div>ลงชื่อ ....................................<br>ผู้ตรวจสอบ</div>
    </div>`;
}

function doPrint() {
  // รอรูปโหลดก่อนเปิดหน้าพิมพ์ (สำคัญบน iOS Safari)
  const imgs = [...$('report').querySelectorAll('img')].filter(i => !i.complete);
  Promise.all(imgs.map(i => new Promise(res => { i.onload = i.onerror = res; })))
    .then(() => setTimeout(() => window.print(), 100));
}
function openReport() {
  const list = filtered();
  if (!list.length && !confirm('ไม่มีรายการในช่วงที่เลือก ต้องการพิมพ์ต่อหรือไม่?')) return;
  buildReport(list.slice().reverse()); doPrint();
}
function printOne(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  buildReport([r]); doPrint();
}

['fromDate', 'toDate', 'search'].forEach(id => $(id).addEventListener('input', render));
resetForm(); render();
</script>
</body>
</html>
